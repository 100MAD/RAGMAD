name: CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "alembic/**"
      - "alembic.ini"
      - "tests/**"
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - "docker-compose.yml"
      - "docker-compose.ci.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  COMPOSE_FILE: docker-compose.ci.yml

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start dependencies
        run: docker compose up -d --wait

      - name: Wait for MinIO and Qdrant
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:6333/readyz \
              && curl -sf http://127.0.0.1:9000/minio/health/live; then
              echo "Dependencies are ready"
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for qdrant/minio"
          docker compose ps
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: huggingface-${{ hashFiles('uv.lock') }}
          restore-keys: |
            huggingface-

      - name: Run tests
        run: uv run pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
