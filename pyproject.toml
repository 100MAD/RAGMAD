[project]
name = "ragmad"
version = "0.1.0"
description = "RAG chat backend: parse documents, retrieve passages, and answer questions."
readme = "README.md"
authors = [
    { name = "Mohammad Mortezapour", email = "mohammad.mortezapour@zarrino.io" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.108",
    "docling>=2.134.0",
    "fastapi>=0.142.2",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-huggingface>=0.8.0",
    "llama-index-llms-openai-like>=0.8.1",
    "llama-index-node-parser-docling>=0.5.0",
    "llama-index-readers-docling>=0.5.0",
    "llama-index-vector-stores-qdrant>=0.10.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=3.3,<4",
    "sqlalchemy>=2",
    "torch==2.2.2",
    "torchvision==0.17.2",
    "transformers>=4.46,<5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
eval = [
    "langchain-community>=0.3.27,<0.4",
    "ragas>=0.4.3",
]

[tool.uv]
package = false
override-dependencies = [
    "numpy>=1.26.4,<2",
    "scipy>=1.11.4,<1.14",
    "scikit-learn>=1.4,<1.6",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
