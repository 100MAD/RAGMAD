services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ragmad
      POSTGRES_PASSWORD: ragmad
      POSTGRES_DB: ragmad
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragmad -d ragmad"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  api:
    build: .
    image: ragmad-api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://ragmad:ragmad@postgres:5432/ragmad
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: ragmad
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started

  ui:
    build:
      context: ../RAGMAD-UI
    image: ragmad-ui
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  qdrant:
  minio:
